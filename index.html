<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1 class="main-title">Joyce的下载站</h1>
<p style="text-align: center; color: rgba(255,255,255,0.8); margin-top: -30px; margin-bottom: 40px; font-size: 1.1rem;">
    岳浩宇 joyce09.com 开发
</p>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-canvas"></div>

    <div id="app">
        <section id="home-view" class="view active">
            <h1 class="main-title">Joyce的下载站</h1>
            <div class="menu-grid">
                <div class="glass-card" onclick="enterFolder('software')">
                    <div class="icon-wrap">🚀</div>
                    <h2>软件资源</h2>
                    <p>Windows / Android</p>
                </div>
                <div class="glass-card" onclick="enterFolder('gallery')">
                    <div class="icon-wrap">🎞️</div>
                    <h2>图库选项</h2>
                    <p>精选影像集</p>
                </div>
            </div>
        </section>

        <section id="folder-view" class="view">
            <div class="nav-header">
                <button class="btn-back" onclick="exitFolder()">← 首页</button>
                <h2 id="folder-title-text">资源列表</h2>
            </div>
            <div id="file-list" class="file-grid">
                </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
